[project]
name = "vision-worker"
version = "0.1.0"
description = "LedgerLens vision worker — OpenCV layout + OCR + Groq vision fusion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "httpx>=0.27",
  "groq>=0.11",
]

[project.optional-dependencies]
ocr = [
  # Heavy — install only in Phase 3 / Docker ( ~2GB )
  "paddleocr>=2.7",
  "paddlepaddle>=2.6",
]
eval = ["pytest>=8", "pytest-cov>=5"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
